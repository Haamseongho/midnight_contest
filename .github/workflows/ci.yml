name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Compact compiler
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: "0.31.1"

      - name: Install dependencies
        run: npm ci

      - name: Verify contract, application, and tests
        run: npm run verify
