name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Compact compiler
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: "0.31.1"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Verify contract, application, and tests
        run: npm run verify

  local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Compact compiler
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: "0.31.1"

      - name: Install dependencies
        run: npm ci

      - name: Start the local Midnight stack
        run: docker compose -f devnet/compose.yml up -d --wait --wait-timeout 240

      - name: Deploy, claim, and reject replay on the local network
        run: npm run test:local

      - name: Print local stack logs after a failure
        if: failure()
        run: docker compose -f devnet/compose.yml logs --no-color

      - name: Stop the local Midnight stack
        if: always()
        run: docker compose -f devnet/compose.yml down -v
